# Paper trading only (live_enabled is false; no live broker exists). See docs/RUNBOOK.md.
#
# Databases: one SQLite file per account (var/luna_perp.db, var/luna_spot.db); each bot is the only
# writer of its own file (no shared WAL database across containers over the bind mount); the
# dashboard opens them read-only. Legacy var/luna.db: `luna migrate-db --account perp` (RUNBOOK §1).
#
# Bot healthcheck: `luna health` exits 0 iff the account's latest equity row (written by every
# completed 15-minute tick) is < 20 min old. start_period 30m covers the startup work before the
# first equity row can exist: the model fit on a cold start (trade lists over the full history;
# minutes on this machine, longer on a small VPS) plus up to 15 min of waiting for the first
# 15-minute boundary. Failures inside start_period are not counted; the first success marks the
# container healthy immediately.
x-bot-healthcheck: &bot-healthcheck
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 30m

services:
  bot-perp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["paper", "--account", "perp"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./var:/app/var
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      <<: *bot-healthcheck
      test: ["CMD", "uv", "run", "luna", "health", "--account", "perp"]

  bot-spot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["paper", "--account", "spot"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./var:/app/var
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      <<: *bot-healthcheck
      test: ["CMD", "uv", "run", "luna", "health", "--account", "spot"]

  # V4 forward data collector (docs/superpowers/specs/luna-v4-forward-collector-design.md): raw
  # Kraken public snapshots into var/forward, its own lock (var/forward/collector.lock). Healthcheck:
  # `luna collector-health` exits 0 iff fut_tickers/spot_ticker succeeded < 3 min and fut_funding
  # < 2 h ago (funding gets a 2 h grace after a start); start_period 5m covers the first rounds.
  # Backup: set LUNA_FORWARD_BACKUP_HOST_DIR in .env to a host directory (OneDrive/Google Drive
  # sync folder, external disk, rclone mount); it is mounted at /backup and only then is
  # LUNA_FORWARD_BACKUP_DIR set (otherwise it is "", i.e. not configured: collection continues and
  # collector-health / the dashboard warn). Exit code 3 (no ticker success for 30 min) -> restart.
  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["collect"]
    hostname: luna-collector  # stable across recreates: the lock treats it as the same host
    env_file:
      - path: .env
        required: false
    environment:
      LUNA_FORWARD_BACKUP_DIR: ${LUNA_FORWARD_BACKUP_HOST_DIR:+/backup}
    volumes:
      - ./var:/app/var
      - ${LUNA_FORWARD_BACKUP_HOST_DIR:-./var/.forward_backup_unset}:/backup
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "uv", "run", "luna", "collector-health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m

  # V5 adaptive funding carry (docs/superpowers/specs/luna-v5-adaptive-carry.md): long-running,
  # event-driven, PAPER ONLY (risk.live_enabled false; PaperBroker). Reads the collector's
  # var/forward raw files read-only (needs the collector running); its own DB var/luna_carry.db.
  # Healthcheck: `luna carry-health` exits 0 iff an evaluation ran < 5 min ago on a collector
  # snapshot < 10 min old; start_period 5m covers the funding-history bootstrap.
  bot-carry:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["carry"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./var:/app/var
      - ./var/forward:/app/var/forward:ro  # collector data: read-only for the carry bot
    depends_on:
      - collector
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "uv", "run", "luna", "carry-health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["uv", "run", "streamlit"]
    command: ["run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"  # no auth: local only (VPS: ssh -L 8501:localhost:8501)
    env_file:
      - path: .env
        required: false
    volumes:
      - ./var:/app/var
    restart: unless-stopped
