  spot:  # Kraken Pro Tier 1, corrected 2026-10-08 (SC-2; was 0.0025 / 0.004)
    maker_fee: 0.004
    taker_fee: 0.008
    half_spread_bps: {BTC: 2, ETH: 3, default: 3}
