universe:
  min_adv_usd: 10000000
  min_history_days: 548
  prefilter_volume_usd: 3000000
  history_start: "2023-01-01"
walkforward:
  train_months: 6
  test_months: 2
  step_months: 2
  holdout_months: 3
ranking:
  n0: 50
  n_min: 30
  bootstrap_samples: 2000
  ci: 0.90
pairs:
  corr_min: 0.7
  fdr_q: 0.05
  stability_p: 0.10
  half_life_min: 8
  half_life_max: 192
  beta_change_max: 0.25
