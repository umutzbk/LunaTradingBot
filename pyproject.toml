[project]
name = "luna"
version = "0.1.0"
description = "Systematic crypto trading research and paper-trading platform (Kraken perp + spot)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "numba",
    "statsmodels",
    "scipy",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML",
    "SQLAlchemy>=2",
    "typer",
    "plotly",
    "streamlit",
    "pyarrow",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
luna = "luna.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luna"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: tests that touch the network (excluded by default)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
